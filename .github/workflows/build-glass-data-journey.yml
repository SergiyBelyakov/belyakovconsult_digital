name: Build BC glass 3D assets
on:
  push:
    branches: [glass-data-journey-release-20261021]
    paths:
      - .github/workflows/build-glass-data-journey.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 3D asset generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r data-journey/source/requirements.txt
      - name: Build glass models
        run: python data-journey/source/build_glass.py
      - name: Render previews
        run: python data-journey/source/render_glass.py --samples 64
      - name: Refresh catalog and composite image
        run: python data-journey/source/refresh_catalog.py
      - name: Validate all GLB models and previews
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from pygltflib import GLTF2
          root = Path("data-journey/assets/glass")
          catalog = json.loads((root/"catalog.json").read_text())
          assert len(catalog) == 50, f"Expected 50 GLB models, got {len(catalog)}"
          for item in catalog:
              model = root/"models"/item["file"]
              preview = root/"previews"/item["file"].replace(".glb", ".webp")
              assert model.is_file() and model.stat().st_size > 10000, model
              assert preview.is_file() and preview.stat().st_size > 1000, preview
              assert hashlib.sha256(model.read_bytes()).hexdigest() == item["sha256"], model
              assert len(GLTF2().load(str(model)).animations) >= 2, model
          assert (root/"services.webp").is_file()
          print("Validated", len(catalog), "3D models and 50 previews")
          PY
      - name: Commit generated site assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-journey/assets/glass data-journey/glass-index.js
          git diff --cached --quiet || git commit -m "Add 50 glass 3D models and rendered previews"
          git push origin HEAD:glass-data-journey-release-20261021
